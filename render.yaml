# Render Blueprint: backend (Docker web service) + farmer app (static site). DEPLOY.md explains every step.
# Render → New → Blueprint → pick this repository. Values marked "sync: false" are asked for in the dashboard.
services:
  - type: web
    name: agriai-api
    runtime: docker
    plan: free # test-pilot (no budget yet). Before wider use: plan: starter (always on), see DEPLOY.md
    region: singapore # closest Render region to Rajasthan
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      # Render's load balancer (and the static site's /api rewrite) sit in front of the app.
      - key: TRUST_PROXY
        value: "2"
      - key: CORS_ORIGIN
        sync: false # https://agriai-web.onrender.com (or your custom domain)
      - key: MONGO_URI
        sync: false # mongodb+srv://... from MongoDB Atlas
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-3.1-flash-lite
      - key: GEMINI_ATTEMPT_TIMEOUT_SECONDS
        value: "25"
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false # cloudinary://<key>:<secret>@<cloud>
      - key: SENTRY_DSN
        sync: false # optional
      - key: DATA_GOV_API_KEY
        sync: false # optional (mandi prices)
      - key: VAPID_PUBLIC_KEY
        sync: false # optional (web push)
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: INVITE_ONLY
        value: "true"

  - type: web
    name: agriai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SENTRY_DSN
        sync: false # optional, the frontend project's DSN
    routes:
      # The app and the API share one address: the login cookie stays first-party and CSP 'self' covers the API.
      - type: rewrite
        source: /api/*
        destination: https://agriai-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Keep in sync with frontend/nginx/security-headers.conf
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com; font-src 'self'; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
