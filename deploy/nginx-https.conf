# HTTPS on your own server (VPS). Mounted over the image's default.conf by docker-compose.prod.yml.
# Needs a certificate in ./deploy/certs (fullchain.pem + privkey.pem), e.g. from Let's Encrypt (DEPLOY.md).
# The container is unprivileged: it listens on 8080/8443; the host maps 80 → 8080 and 443 → 8443.
include /etc/nginx/snippets/http.conf;

server {
    listen 8080;
    # Let's Encrypt renewals (certbot --webroot -w ./deploy/acme).
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (browsers remember to use HTTPS only) is sent by security-headers.conf on HTTPS.
    include /etc/nginx/snippets/app-locations.conf;
}
