# Production on your own server (VPS) with HTTPS. For Render see DEPLOY.md instead.
#
#   cp backend/.env.example backend/.env       # set NODE_ENV=production, MONGO_URI (Atlas), JWT_SECRET, CORS_ORIGIN ...
#   docker compose -f docker-compose.prod.yml up -d --build
#
# HTTPS: put fullchain.pem + privkey.pem in ./deploy/certs (Let's Encrypt, DEPLOY.md). Without certificates use
# docker-compose.yml (plain http) behind Cloudflare or another TLS proxy.
# The database is MongoDB Atlas (MONGO_URI in backend/.env). For a local database instead, add
# "--profile local-db" and set MONGO_URI=mongodb://mongo:27017/agriai?replicaSet=rs0.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      TRUST_PROXY: 1
      PORT: 4000
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_RELEASE: ${VITE_RELEASE:-}
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/acme:/var/www/acme:ro
    tmpfs: [/tmp, /var/cache/nginx]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - backend
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  mongo:
    profiles: [local-db]
    image: mongo:8.0
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20

volumes:
  mongo-data:
