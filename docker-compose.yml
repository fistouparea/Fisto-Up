# Runs the whole app: MongoDB + backend + frontend (nginx).
# 1. Create backend/.env from backend/.env.example and add GEMINI_API_KEY.
# 2. docker compose up --build
# 3. Open http://localhost:8080
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # No published port: only the backend can reach the database.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/agriai
      CORS_ORIGIN: http://localhost:8080
      TRUST_PROXY: 1
      PORT: 4000
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
