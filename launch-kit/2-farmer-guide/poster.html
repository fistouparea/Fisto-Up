<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>AgriAI – पोस्टर</title>
<link rel="stylesheet" href="../assets/print.css">
<style>
  .page { min-height: 0; }
  body { text-align: center; }
  .top { background: var(--green); color: #fff; border-radius: 6mm; padding: 5mm 6mm; }
  .top h1 { color: #fff; font-size: 38pt; margin: 0; }
  .top p { font-size: 22pt; margin: 2mm 0 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; margin: 5mm 0; }
  .grid div { border: 3px solid var(--yellow); border-radius: 5mm; padding: 3mm; font-size: 19pt; font-weight: 700; background: var(--cream); }
  .grid span { display: block; font-size: 36pt; }
  .qr { width: 62mm; height: 62mm; margin: 0 auto; border: 4px dashed #333; display: flex; align-items: center; justify-content: center; font-size: 16pt; }
  .free { font-size: 26pt; font-weight: 700; color: var(--green-dark); margin: 5mm 0 2mm; }
</style>
</head>
<body>
<section class="page">
  <div class="top"><h1>AgriAI 🌾</h1><p>खेती का साथी – आपके फ़ोन में</p></div>
  <div class="grid">
    <div><span>📷</span>फोटो से बीमारी जाँच</div>
    <div><span>🌦️</span>मौसम और पानी की सलाह</div>
    <div><span>🧺</span>अपनी उपज बेचें</div>
    <div><span>🚚</span>साथ में मंडी चलें</div>
  </div>
  <div class="qr">यहाँ QR कोड लगाएँ<br>(ऐप का लिंक)</div>
  <p class="free">मुफ़्त • हिंदी में • बोलकर भी चलाएँ 🎤</p>
  <p style="font-size:18pt">लिंक: <span class="line" style="min-width:90mm"></span></p>
  <p style="font-size:18pt">मदद: SHG दीदी <span class="line"></span> फ़ोन <span class="line" style="min-width:45mm"></span></p>
</section>
</body>
</html>
