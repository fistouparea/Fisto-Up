# Plain HTTP on 8080. Used by docker compose locally and behind a TLS proxy (Cloudflare, Render, a load balancer).
# For HTTPS on your own server use deploy/nginx-https.conf (docker-compose.prod.yml, see DEPLOY.md).
include /etc/nginx/snippets/http.conf;

server {
    listen 8080;
    include /etc/nginx/snippets/app-locations.conf;
}
