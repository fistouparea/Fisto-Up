# Security headers for every response of the farmer app. Included in each location block, because nginx
# drops server-level add_header lines in any location that has its own add_header.
#
# CSP: only our own scripts (no inline scripts, no eval). Inline styles are needed by the toast and
# animation libraries. Images: our API, phone previews (blob:/data:) and Cloudinary photos.
# connect-src: our API (same origin through nginx) and Sentry error reports (only sent if a DSN is set).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com; font-src 'self'; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# Camera (photo), microphone (voice questions) and location (farm GPS) only for our own pages.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $hsts_header always;
