# http-level settings: gzip and the HSTS switch.
# Compress text answers (JS, CSS, JSON, SVG): about 70% less data on slow mobile networks.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/csv application/javascript application/json application/manifest+json image/svg+xml;

# HSTS only on HTTPS connections that nginx itself terminates (an empty value sends no header).
map $scheme $hsts_header {
    https "max-age=31536000; includeSubDomains";
    default "";
}
