# Locations shared by the plain-HTTP server (nginx.conf) and the HTTPS server (deploy/nginx-https.conf).
# Every location that sets its own header includes the security headers again (nginx does not inherit them).

root /usr/share/nginx/html;
server_tokens off;

# Photos are compressed on the phone, but allow up to the backend's 5 MB limit.
client_max_body_size 6m;

location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Diagnosis can take a while (AI timeout + retries).
    proxy_read_timeout 120s;
}

# Built files have a content hash in their name: cache for a year, never revalidate.
location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location /icons/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}

# Always check for a new app version (service worker, its registration, manifest, the page itself).
location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest|index\.html)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
